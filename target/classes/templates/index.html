<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library Management</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body><main class="container py-5"><h1>Library Management System</h1><p>Book inventory, lending and returns</p><div class="card p-4 mb-4"><h4>Add book</h4><form action="/book" method="post" class="row g-2"><input name="title" class="form-control col" placeholder="Title" required><input name="author" class="form-control col" placeholder="Author" required><input name="copies" type="number" min="1" value="1" class="form-control col" required><button class="btn btn-primary">Add</button></form></div><div class="card p-4 mb-4"><h4>Inventory</h4><table class="table"><tr><th>Book</th><th>Author</th><th>Available</th><th>Issue</th></tr><tr th:each="b:${books}"><td th:text="${b.title}"></td><td th:text="${b.author}"></td><td th:text="${b.available}+'/'+${b.copies}"></td><td><form action="/issue" method="post" class="d-flex gap-2"><input type="hidden" name="bookId" th:value="${b.id}"><input name="borrower" class="form-control" placeholder="Borrower" required><button class="btn btn-success" th:disabled="${b.available<1}">Issue</button></form></td></tr></table></div><div class="card p-4"><h4>Loans / Returns</h4><table class="table"><tr><th>Book ID</th><th>Borrower</th><th>Due date</th><th>Status</th><th>Fine</th><th></th></tr><tr th:each="l:${loans}"><td th:text="${l.bookId}"></td><td th:text="${l.borrower}"></td><td th:text="${l.due}"></td><td th:text="${l.returned?'Returned':'Issued'}"></td><td th:text="'₹'+${l.fine}"></td><td><a th:if="${!l.returned}" th:href="@{/return/{id}(id=${l.id})}">Return</a></td></tr></table><small>14-day loan; ₹5 per overdue day, calculated at return.</small></div></main></body></html>
